function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}
const intro=[
{title:"Welcome to Bengaluru’s birds",sub:"A visual field course • 222 species",body:"Learn to notice a few reliable clues at a time. You do not need to memorize technical terms or identify every bird instantly.",tips:["Look first; name it second.","Notice the whole shape before focusing on colour.","Use sound and habitat as supporting clues."]},
{title:"A simple birdwatching routine",sub:"Pause • Observe • Compare",body:"Give a bird a few quiet moments. Watch how it moves, where it feeds, and which features remain visible as it turns.",tips:["Estimate size against a familiar bird.","Check bill shape, tail length and posture.","Avoid getting closer if the bird changes its behaviour."]},
{title:"Start with shape and movement",sub:"Your quickest visual clues",body:"Silhouette often helps more than a fleeting colour. A long-legged wader, compact kingfisher and upright robin look different even at a distance.",tips:["Long legs often point toward waders.","A hovering bird over grass may be hunting.","Tail flicking, hopping and climbing can narrow the possibilities."]},
{title:"Listen for patterns",sub:"Calls and songs",body:"You can learn a sound without knowing its technical name. Listen for rhythm, pitch, repetition and where the bird is calling from.",tips:["Compare several recordings, not just one.","Notice whether the sound is a short call or a longer song.","Use sound together with what you can see."]},
{title:"Habitat is a clue, not a verdict",sub:"Gardens • scrub • woodland • wetlands",body:"Where a bird is found can make some identities more likely. Bengaluru’s parks, lakes, open scrub and wooded areas each host different communities.",tips:["Ask what the bird is doing in that habitat.","Remember that migrants and seasonal visitors change what you may see.","Confirm with appearance and sound; habitat alone is not proof."]},
{title:"How to compare similar birds",sub:"Find one dependable difference",body:"When two birds look alike, compare them directly. Avoid trying to remember every detail at once.",tips:["Compare size and overall shape first.","Look for one clear mark: eyebrow, cheek, wing patch, bill or tail.","Then compare behaviour, habitat and calls."]}
];
const birds=raw;
let slide=0;
const total=intro.length+birds.length*2;
function media(b){const q=encodeURIComponent(b.common+" "+b.scientific);return {photo:"https://commons.wikimedia.org/w/index.php?search="+q+"&title=Special:MediaSearch&type=image",audio:"https://www.xeno-canto.org/explore?query="+q,ml:"https://search.macaulaylibrary.org/catalog?searchField=species&view=grid"};}
function current(){if(slide<intro.length)return {kind:"intro",data:intro[slide]};const n=Math.floor((slide-intro.length)/2),part=(slide-intro.length)%2;return {kind:"bird",data:birds[n],part};}
function render(){
 const s=current(), el=document.querySelector("#lesson");
 document.querySelector("#progress").textContent=(slide+1)+" / "+total+" • "+(s.kind==="intro"?"Getting started":s.data.common);
 document.querySelector("#prev").disabled=slide===0;document.querySelector("#next").textContent=slide===total-1?"Course complete":"Next →";
 if(s.kind==="intro"){const d=s.data;el.innerHTML='<div class="slide intro"><div class="eyebrow">FIELD SKILLS</div><h2>'+esc(d.title)+'</h2><p class="subtitle">'+esc(d.sub)+'</p><p class="lead">'+esc(d.body)+'</p><h3>Remember</h3><ul>'+d.tips.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul></div>';return;}
 const b=s.data, links=media(b), clue=clues[b.common]||"Begin with its overall shape, main colours, bill and tail. Watch how it moves and where it feeds; compare a few regional examples before deciding.";
 const first=s.part===0;
 el.innerHTML='<div class="slide birdslide"><div class="eyebrow">BIRD '+b.id+' OF '+birds.length+' • SLIDE '+(s.part+1)+' OF 2</div><div class="birdlayout"><div class="visual"><div class="photo" id="photo"><span>Finding a photograph…</span></div><div class="mediabtn"><a target="_blank" rel="noopener" href="'+links.photo+'">More photos</a><a target="_blank" rel="noopener" href="'+links.audio+'">Listen to recordings</a></div><p class="smallnote">Media opens from Wikimedia Commons / Xeno-canto. Check the recording or photo page for the exact species, location and licence.</p></div><div class="lessontext"><h2>'+esc(b.common)+'</h2><p class="subtitle"><i>'+esc(b.scientific)+'</i> · '+esc(b.family)+'</p><span class="tag">'+esc(b.habitat)+'</span>'+(first?'<h3>Meet the bird</h3><p>'+esc(clue)+'</p><h3>What to notice</h3><ul><li>Overall size and body shape</li><li>Bill, tail and posture</li><li>Where it is feeding or resting</li></ul><h3>Sound</h3><p>Listen for its repeated call or song. Notice the rhythm and pitch, then compare more than one recording.</p>':'<h3>Recognize it in the field</h3><p>'+esc(clue)+'</p><h3>Food, behaviour and nesting</h3><p>Watch where it searches for food and how it moves. Many birds feed, nest and display differently across seasons; avoid assuming one behaviour applies to every individual or site.</p><h3>How to tell it apart</h3><ul><li>Compare its silhouette and most distinctive visible mark with similar birds.</li><li>Use habitat and behaviour as extra clues, not as the only evidence.</li><li>Check the sound and regional photos if the view was brief or distant.</li></ul>')+'</div></div></div>';
 loadPhoto(b);
}
async function loadPhoto(b){const holder=document.querySelector("#photo");if(!holder)return;try{const wp="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(b.scientific);const j=await fetch(wp).then(r=>r.ok?r.json():null);const img=j?.originalimage?.source||j?.thumbnail?.source;if(img&&document.querySelector("#photo")===holder){const im=document.createElement("img");im.alt=b.common+" ("+b.scientific+")";im.src=img;im.onerror=()=>commonsPhoto(b,holder);holder.innerHTML="";holder.appendChild(im);return;}commonsPhoto(b,holder);}catch(e){commonsPhoto(b,holder);}}
async function commonsPhoto(b,holder){try{const q=encodeURIComponent('"'+b.scientific+'"');const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+q+"&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1100&format=json&origin=*";const j=await fetch(url).then(r=>r.json());const pages=Object.values(j.query?.pages||{});const good=pages.filter(x=>{const t=(x.title||"").toLowerCase();return t.includes(b.scientific.toLowerCase())||t.includes(b.common.toLowerCase())}).find(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url);if(good&&document.querySelector("#photo")===holder){const im=document.createElement("img");im.alt=b.common+" ("+b.scientific+")";im.src=good.imageinfo[0].thumburl||good.imageinfo[0].url;holder.innerHTML="";holder.appendChild(im);}else holder.innerHTML="<span>No verified taxon image found. Use More photos to browse.</span>";}catch(e){holder.innerHTML="<span>Image could not load. Use More photos to browse.</span>";}}

// ---------- 250-question field assessment ----------
const regionTips={
"Urban & gardens":"residential streets, apartment compounds, city parks and mature garden trees",
"Woodland":"wooded parks, scrubby woodland edges and shaded vegetation around Bengaluru",
"Grassland & scrub":"open scrub, grassy edges, rocky or thorny patches and dry field margins",
"Wetlands":"lakes, tanks, marshy edges and shallow water around Bengaluru",
"Open country":"dry open ground, fields, fallow plots and grassland",
"Seasonal migrant":"Bengaluru wetlands, parks and open habitats during the appropriate migration season"
};
const hardPairs=[
["Common Myna","Jungle Myna"],["Great Egret","Intermediate Egret"],["Little Egret","Cattle Egret"],
["Black Kite","Brahminy Kite"],["Shikra","Black-winged Kite"],["Common Kingfisher","Stork-billed Kingfisher"],
["Pied Kingfisher","Common Kingfisher"],["Jungle Babbler","Large Grey Babbler"],["Common Sandpiper","Green Sandpiper"],
["Common Greenshank","Wood Sandpiper"],["Black-winged Stilt","Pied Avocet"],["Red-wattled Lapwing","Yellow-wattled Lapwing"],
["Coppersmith Barbet","White-cheeked Barbet"],["Red-vented Bulbul","Red-whiskered Bulbul"],
["Rose-ringed Parakeet","Alexandrine Parakeet"],["Asian Koel","Common Hawk-Cuckoo"],
["Little Cormorant","Indian Cormorant"],["Great Cormorant","Little Cormorant"],
["Indian Pond Heron","Cattle Egret"],["Spotted Owlet","Indian Scops-Owl"],
["Pied Bushchat","Common Stonechat"],["White-rumped Shama","Oriental Magpie-Robin"],
["Yellow-footed Green-Pigeon","Orange-breasted Green-Pigeon"],["Black Eagle","Crested Serpent-Eagle"]
];
function getBird(name){return birds.find(b=>b.common===name)||birds.find(b=>b.common.toLowerCase()===name.toLowerCase())||birds[0];}
function uniqueChoices(answer,seed,count=4){
 const pool=[];
 const preferred=hardPairs.filter(p=>p.includes(answer)).flat().filter(x=>x!==answer);
 for(const x of preferred){if(!pool.includes(x)&&birds.some(b=>b.common===x))pool.push(x);}
 const same=birds.filter(b=>b!==answer && (b.family===answer.family||b.habitat===answer.habitat));
 for(const b of same)if(!pool.includes(b.common)&&b.common!==answer.common)pool.push(b.common);
 for(const b of birds)if(!pool.includes(b.common)&&b.common!==answer.common)pool.push(b.common);
 return [answer.common,...pool.slice(0,count-1)].sort(()=>Math.random()-.5);
}
function silhouetteSVG(b){
 const fam=b.family, wet=/Wetlands|Scolopacidae|Ardeidae|Recurvirostridae|Jacanidae|Laridae/.test(fam+" "+b.habitat);
 const raptor=/Accipitridae|Falconidae|Pandionidae/.test(fam);
 const owl=/Strigidae|Tytonidae/.test(fam);
 const parrot=/Psittaculidae/.test(fam);
 const long=wet?75:raptor?58:owl?48:parrot?62:50;
 const tail=wet?35:raptor?55:parrot?68:42;
 return '<svg viewBox="0 0 520 240" role="img" aria-label="Bird silhouette"><g fill="#26352c"><ellipse cx="250" cy="120" rx="'+long+'" ry="'+(wet?35:40)+'"/><circle cx="'+(250+long-8)+'" cy="105" r="'+(wet?18:24)+'"/><path d="M '+(210-long/2)+' 120 L '+(160-tail)+' '+(wet?150:175)+' L '+(225-long/4)+' 145 Z"/><path d="M '+(220-long/3)+' 95 Q 250 35 300 100 Q 270 85 235 115 Z"/><path d="M '+(250+long+5)+' 105 L '+(310+long/3)+' 96 L '+(250+long+8)+' 116 Z"/>'+ (wet?'<path d="M 245 145 L 235 215 L 242 215 L 254 150 Z"/><path d="M 265 145 L 278 215 L 285 215 L 275 145 Z"/>':'') +'</g></svg>';
}
function fieldQuestions(){
 const targets=[birds[0],birds[4],birds[5],birds[6],birds[7],birds[8],birds[9],birds[10],birds[11],birds[12],birds[13],birds[16],birds[17],birds[18],birds[20],birds[22],birds[27],birds[28],birds[30],birds[31],birds[34],birds[40],birds[41],birds[43],birds[47],birds[49],birds[54],birds[56],birds[61],birds[67],birds[72],birds[77],birds[80],birds[83],birds[88],birds[94],birds[101],birds[104],birds[108],birds[113],birds[120],birds[128],birds[135],birds[145],birds[155],birds[166],birds[181],birds[194],birds[207],birds[218]];
 const templates=[
  b=>"At "+regionTips[b.habitat]+", you get a 5–10 second view. The bird's overall build is clearer than its colour, and its feeding movement is more informative than its call. Which choice should you investigate first?",
  b=>"At "+regionTips[b.habitat]+", a bird moves through the habitat without behaving like the most obvious species you would expect there. You notice its "+(b.family==="Ardeidae"?"bill and leg proportions":b.family==="Accipitridae"||b.family==="Falconidae"?"wing shape and tail":b.family==="Muscicapidae"?"posture and perch-to-ground movement":"tail length and body shape")+". Which identification is best supported?",
  b=>"A field note from Bengaluru reads: ""+regionTips[b.habitat]+"; brief view; bird remained "+(b.habitat==="Wetlands"?"close to the water edge":"within the vegetation/open ground")+"; size was estimated relative to a common myna; one structural feature was obvious but plumage was poorly lit." Which candidate deserves the closest comparison?",
  b=>"You are identifying a distant bird through heat haze. Habitat narrows the list, but two choices look plausible. The deciding evidence is more likely to come from "+(b.habitat==="Wetlands"?"leg length, bill shape and feeding posture":"silhouette, tail shape and movement")+" than from fine colour. Which bird fits the combined evidence?",
  b=>"A companion calls it a familiar Bengaluru bird, but you are not convinced. Your notes say: "+regionTips[b.habitat]+"; "+(b.family==="Muscicapidae"?"frequent short flights from low perches":b.family==="Accipitridae"||b.family==="Falconidae"?"active flight with a strong, purposeful wingbeat":b.family==="Ardeidae"?"slow movement while scanning shallow water":"repeated movement between nearby feeding spots")+". Which answer is most defensible?"
 ];
 return targets.map((b,i)=>({type:"field",answer:b.common,prompt:templates[i%templates.length](b),explain:"Do not accept a habitat-only identification. The intended skill is combining location, body shape, movement and one dependable field mark before committing.",choices:uniqueChoices(b)}));
}
function silhouetteQuestions(){
 const pool=birds.filter(b=>["Wetlands","Open country","Grassland & scrub","Seasonal migrant","Woodland"].includes(b.habitat));
 const templates=[
  b=>"The silhouette is intentionally missing plumage detail. In "+regionTips[b.habitat]+", which candidate best fits the body proportions shown? Treat the habitat as a filter, not proof.",
  b=>"From a backlit view you can only judge outline, bill projection and leg length. The setting is "+regionTips[b.habitat]+". Which species should you compare first?",
  b=>"A distant bird is reduced to a dark outline. It is roughly the size implied by the silhouette and is using "+regionTips[b.habitat]+". Which option is the strongest structural match?",
  b=>"Ignore colour completely. Use the outline, posture and the Bengaluru setting—"+regionTips[b.habitat]+"—to choose the best candidate. Which distractor would you want to rule out next?",
  b=>"The bird is partly obscured, so only silhouette and habitat survive. The habitat is "+regionTips[b.habitat]+". Which identification is most consistent with the shape before any plumage clues are added?"
 ];
 const qs=[];
 for(let i=0;i<100;i++){const b=pool[(i*7+13)%pool.length];qs.push({type:"silhouette",answer:b.common,prompt:templates[i%templates.length](b),visual:b,explain:"Silhouette questions reward structure-first identification. Compare bill projection, body depth, tail, leg length and posture; only then use the habitat clue.",choices:uniqueChoices(b)});}
 return qs;
}
function photoQuestions(){
 const pool=birds.filter(b=>!!b.scientific);
 const templates=[
  "Study the photograph before looking at the choices. Which species is shown, and which single field mark would you use to defend that choice?",
  "The photograph is your primary evidence. Which species fits the visible structure, plumage pattern and posture better than the close alternatives?",
  "Identify the bird from the photograph. Do not choose by colour alone: which combination of bill, tail, body shape and habitat expectation supports your answer?",
  "This is a regional identification challenge. Which species is shown? After choosing, name the closest distractor you would compare in the field.",
  "Look for the feature that survives even if lighting or age changes the apparent colour. Which species best matches the photograph?"
 ];
 const qs=[];
 for(let i=0;i<100;i++){const b=pool[(i*11+5)%pool.length];qs.push({type:"photo",answer:b.common,prompt:templates[i%templates.length],visual:b,explain:"Use at least two independent clues from the photograph. The distractors are chosen from birds that can occur in Bengaluru or nearby habitats, so a single colour patch should not be enough.",choices:uniqueChoices(b)});}
 return qs;
}
const quizQuestions=[...fieldQuestions(),...silhouetteQuestions(),...photoQuestions()];
if(quizQuestions.length!==250) console.error("Quiz count error",quizQuestions.length);
let quizIndex=0,quizScore=0,quizAnswered=false;
function quizTypeLabel(q){return q.type==="field"?"50 REAL-LIFE FIELD SCENARIOS":q.type==="silhouette"?"100 SILHOUETTE + REGION":"100 PHOTO IDENTIFICATIONS";}
function renderQuiz(){
 const q=quizQuestions[quizIndex], card=document.querySelector("#quizCard");
 quizAnswered=false;
 card.innerHTML='<div class="quizMeta"><span class="quizType">'+quizTypeLabel(q)+'</span><span>Question '+(quizIndex+1)+' of 250</span><span>Score '+quizScore+'</span></div>'+
 '<div class="quizPrompt">'+esc(q.prompt)+'</div>'+
 (q.type==="silhouette"?'<div class="quizVisual">'+silhouetteSVG(q.visual)+'</div>':q.type==="photo"?'<div class="quizVisual" id="quizPhoto"><span>Loading an exact taxon image…</span></div>':'')+
 '<div class="choices">'+q.choices.map((x,i)=>'<button class="choice" data-i="'+i+'">'+esc(x)+'</button>').join("")+'</div>'+
 '<div id="quizExplain"></div><div class="quizActions"><button id="nextQ" class="secondary" disabled>'+ (quizIndex===249?"Finish assessment":"Next question →") +'</button><button id="quitQ" class="secondary">Back to course</button></div>';
 document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>answerQuiz(Number(btn.dataset.i)));
 if(q.type==="photo")loadQuizPhoto(q.visual);
 document.querySelector("#nextQ").onclick=()=>{if(!quizAnswered)return;if(quizIndex<249){quizIndex++;renderQuiz();}else finishQuiz();};
 document.querySelector("#quitQ").onclick=()=>{document.querySelector("#practice").classList.add("quizHidden");document.querySelector("#lesson").scrollIntoView({behavior:"smooth"});};
}
async function loadQuizPhoto(b){
 const h=document.querySelector("#quizPhoto");if(!h)return;
 try{const j=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(b.scientific)).then(r=>r.ok?r.json():null);const img=j?.originalimage?.source||j?.thumbnail?.source;
 if(img&&document.querySelector("#quizPhoto")===h){const im=document.createElement("img");im.alt=b.common+" ("+b.scientific+")";im.src=img;im.onerror=()=>h.innerHTML="<span>Exact image unavailable for this question.</span>";h.innerHTML="";h.appendChild(im);}
 else h.innerHTML="<span>Exact taxon image unavailable.</span>";}catch(e){h.innerHTML="<span>Image unavailable; use the field-mark choices.</span>";}
}
function answerQuiz(i){
 if(quizAnswered)return;quizAnswered=true;const q=quizQuestions[quizIndex], chosen=q.choices[i], ok=chosen===q.answer;if(ok)quizScore++;
 document.querySelectorAll(".choice").forEach((b,n)=>{const val=q.choices[n];if(val===q.answer)b.classList.add("correct");else if(n===i)b.classList.add("wrong");b.disabled=true;});
 document.querySelector("#quizExplain").innerHTML='<div class="explain"><strong>'+ (ok?"Correct.":"Not quite.")+'</strong> '+esc(q.explain)+'<br><br><strong>Answer:</strong> '+esc(q.answer)+'.</div>';
 document.querySelector("#nextQ").disabled=false;
}
function finishQuiz(){
 const pct=Math.round(quizScore/250*100);
 document.querySelector("#quizCard").innerHTML='<div class="quizMeta"><span class="quizType">ASSESSMENT COMPLETE</span></div><p class="quizScore">'+quizScore+' / 250 ('+pct+'%)</p><p>You completed all 250 questions. A strong score should come from distinguishing close regional alternatives, not memorising obvious colour labels.</p><div class="quizActions"><button id="retryQuiz">Restart 250</button><button id="backCourse">Back to course</button></div>';
 document.querySelector("#retryQuiz").onclick=()=>{quizIndex=0;quizScore=0;renderQuiz();};
 document.querySelector("#backCourse").onclick=()=>{document.querySelector("#practice").classList.add("quizHidden");document.querySelector("#lesson").scrollIntoView({behavior:"smooth"});};
}
function startQuiz(){document.querySelector("#practice").classList.remove("quizHidden");renderQuiz();document.querySelector("#practice").scrollIntoView({behavior:"smooth"});}
document.querySelector("#practiceBtn").onclick=startQuiz;

document.querySelector("#prev").onclick=()=>{slide=Math.max(0,slide-1);render();};
document.querySelector("#next").onclick=()=>{slide=Math.min(total-1,slide+1);render();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.querySelector("#next").click();if(e.key==="ArrowLeft")document.querySelector("#prev").click();});
try{render();}catch(e){console.error("Course render failed:",e);document.querySelector("#lesson").innerHTML="<div class=\"slide\"><h2>Course loading error</h2><p>The lesson engine encountered an error. Refresh the page to retry.</p></div>";}</script>
